name: daily-update

on:
  schedule:
    - cron: "17 5 * * *"    # main run once a day: fetch new papers, extract, verify, publish
    - cron: "7 */2 * * *"   # every 2 hours: ONLY repeats work that failed because the models were down; capped, saves Gemini quota
  workflow_dispatch:         # manual "Run workflow" button: same as the main daily run
  push:                      # design, data or README changes republish only (no model calls)
    branches: [main]
    paths:
      - "web/**"
      - "data/**"
      - "README.md"
      - "src/qtd/site.py"
      - "src/qtd/present.py"
      - "src/qtd/cards.py"
      - "src/qtd/chart.py"
      - "src/qtd/cardimg.py"
      - "src/qtd/readme.py"
      - "scripts/**"
      - ".github/workflows/daily.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      deploy: ${{ steps.flag.outputs.deploy }}
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      QTD_SITE_URL: ${{ vars.QTD_SITE_URL }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Restore model cache and quota counters
        uses: actions/cache@v4
        with:
          path: data/cache
          key: qtd-cache-${{ github.run_id }}
          restore-keys: qtd-cache-
      - name: Install image library for the share card
        run: python -m pip install --quiet pillow pypdf
      - name: Tests must pass before anything runs
        run: python -m unittest discover -s tests
      - name: Decide what to do
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" = "schedule" ] && [ "$SCHEDULE" = "7 */2 * * *" ]; then echo "cmd=retry" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "push" ]; then echo "cmd=none" >> "$GITHUB_OUTPUT"
          else echo "cmd=run" >> "$GITHUB_OUTPUT"; fi
      - name: Run pipeline
        if: steps.mode.outputs.cmd != 'none'
        run: |
          python -m qtd ${{ steps.mode.outputs.cmd }} | tee out.json
          { echo '### qtd output'; echo '```json'; cat out.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Check GitHub releases for post-quantum updates
        if: steps.mode.outputs.cmd != 'none'
        run: python -m qtd pq | tee pq_out.json
      - name: Re-read fact sources (service status, exposed funds)
        if: steps.mode.outputs.cmd != 'none'   # unchanged pages cost no model calls; a changed page costs two
        run: |
          python -m qtd facts | tee facts_out.json
          { echo '### qtd facts'; echo '```json'; cat facts_out.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Refresh the README title link from QTD_SITE_URL
        run: python -m qtd.readme
      - name: Commit changes
        id: commit
        run: bash scripts/commit_data.sh
      - name: Decide whether to publish
        id: flag
        run: |
          if [ "${{ steps.mode.outputs.cmd }}" != "retry" ] || [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; else echo "deploy=false" >> "$GITHUB_OUTPUT"; fi
      - name: Build site
        if: steps.flag.outputs.deploy == 'true'
        run: python -m qtd.site site
      - uses: actions/upload-pages-artifact@v3
        if: steps.flag.outputs.deploy == 'true'
        with:
          path: site

  deploy:
    needs: update
    if: needs.update.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
