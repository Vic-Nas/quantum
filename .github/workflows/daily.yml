name: daily-update

on:
  schedule:
    - cron: "17 5 * * *"    # daily run
    - cron: "17 17 * * *"   # second pass: retries anything queued while models were unavailable
  workflow_dispatch:         # manual "Run workflow" button: same as the daily run
  push:                      # design changes republish the page only (no model calls)
    branches: [main]
    paths:
      - "web/**"
      - "src/qtd/site.py"
      - "src/qtd/present.py"
      - "src/qtd/cards.py"
      - ".github/workflows/daily.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      QTD_SITE_URL: ${{ vars.QTD_SITE_URL }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Restore model cache and quota counters
        uses: actions/cache@v4
        with:
          path: data/cache
          key: qtd-cache-${{ github.run_id }}
          restore-keys: qtd-cache-
      - name: Install image library for the share card
        run: python -m pip install --quiet pillow
      - name: Tests must pass before anything runs
        run: python -m unittest discover -s tests
      - name: Run pipeline
        if: github.event_name != 'push'
        run: |
          python -m qtd run | tee out.json
          { echo '### qtd output'; echo '```json'; cat out.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit data changes
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/attacks.json data/hardware.json data/seen.json data/queue.json data/status.json data/candidates data/proposals 2>/dev/null || true
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "data: update $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Build site
        run: python -m qtd.site site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
